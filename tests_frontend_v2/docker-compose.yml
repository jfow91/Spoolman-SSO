# Spins up Spoolman exactly as it is deployed for real: the production image
# (client baked in, served on the same origin as the API) backed by a real
# PostgreSQL database. The frontend integration tests (Playwright) drive this
# through a browser on the host via the published port.
#
# Unlike tests_frontend/docker-compose.yml this does NOT set
# SPOOLMAN_LEGACY_CLIENT, so the image serves the default (Svelte) client_v2.
services:
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_PASSWORD=spoolman
      - POSTGRES_USER=spoolman
      - POSTGRES_DB=spoolman
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spoolman"]
      interval: 1s
      timeout: 5s
      retries: 30

  # Fake PocketID. Its issuer name is only resolvable inside the compose network, so
  # the test helper reaches it through the published port; see signIn in
  # tests/fixtures.ts. Keep the port at 9000.
  fake-oidc:
    build:
      context: ..
      dockerfile: tests_integration/fake_oidc/Dockerfile
    ports:
      - "9000:9000"

  spoolman:
    image: donkie/spoolman:test
    environment:
      - SPOOLMAN_DB_TYPE=postgres
      - SPOOLMAN_DB_HOST=db
      - SPOOLMAN_DB_PORT=5432
      - SPOOLMAN_DB_NAME=spoolman
      - SPOOLMAN_DB_USERNAME=spoolman
      - SPOOLMAN_DB_PASSWORD=spoolman
      - SPOOLMAN_LOGGING_LEVEL=INFO
      - TZ=Europe/Stockholm
      - SPOOLMAN_OIDC_ISSUER=http://fake-oidc:9000
      - SPOOLMAN_OIDC_CLIENT_ID=spoolman
      - SPOOLMAN_OIDC_CLIENT_SECRET=test-secret
      # Must be the address the browser uses, or the redirect URI will not match.
      - SPOOLMAN_PUBLIC_URL=http://localhost:${SPOOLMAN_HOST_PORT:-8001}
      - SPOOLMAN_SESSION_SECRET=xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
    ports:
      # Host port is configurable so the suite can avoid clashing with a
      # locally running Spoolman — and defaults one above the legacy suite's
      # 8000 so both can be up at once. Container always listens on 8000.
      - "${SPOOLMAN_HOST_PORT:-8001}:8000"
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/health').status==200 else 1)"
      interval: 2s
      timeout: 5s
      retries: 45
      start_period: 5s
    depends_on:
      db:
        condition: service_healthy
      fake-oidc:
        condition: service_started
