version: '3.9'
services:
  fake-oidc:
    image: donkie/spoolman-fake-oidc:test
  db:
    image: mariadb:latest
    environment:
      - MARIADB_USER=john
      - MARIADB_RANDOM_ROOT_PASSWORD=yes
      - MARIADB_PASSWORD=abc
      - MARIADB_DATABASE=spoolman
      - MARIADB_MYSQL_LOCALHOST_USER=true
      - TZ=Asia/Seoul
    healthcheck:
      test:
        [
          "CMD",
          "/usr/local/bin/healthcheck.sh",
          "--su-mysql",
          "--connect",
          "--innodb_initialized"
        ]
      interval: 1s
      timeout: 5s
      retries: 30
  spoolman:
    image: donkie/spoolman:test
    environment:
      - SPOOLMAN_DB_TYPE=mysql
      - SPOOLMAN_DB_HOST=db
      - SPOOLMAN_DB_PORT=3306
      - SPOOLMAN_DB_NAME=spoolman
      - SPOOLMAN_DB_USERNAME=john
      - SPOOLMAN_DB_PASSWORD=abc
      - SPOOLMAN_LOGGING_LEVEL=INFO
      # The host guard refuses public domain names it was not told about; the security
      # tests need one that is allowed as well as one that is not.
      - SPOOLMAN_ALLOWED_HOSTS=spoolman.example.com
      - TZ=Europe/Stockholm
      - SPOOLMAN_OIDC_ISSUER=http://fake-oidc:9000
      - SPOOLMAN_OIDC_CLIENT_ID=spoolman
      - SPOOLMAN_OIDC_CLIENT_SECRET=test-secret
      - SPOOLMAN_PUBLIC_URL=http://spoolman:8000
      - SPOOLMAN_SESSION_SECRET=xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
    depends_on:
      db:
        condition: service_healthy
      fake-oidc:
        condition: service_started
  tester:
    image: donkie/spoolman-tester:latest
    volumes:
      - ./tests:/tester/tests
    environment:
      - DB_TYPE=mysql
    depends_on:
      - spoolman
