version: '3.8'
services:
  fake-oidc:
    image: donkie/spoolman-fake-oidc:test
  spoolman:
    image: donkie/spoolman:test
    environment:
      - SPOOLMAN_LOGGING_LEVEL=INFO
      # The host guard refuses public domain names it was not told about; the security
      # tests need one that is allowed as well as one that is not.
      - SPOOLMAN_ALLOWED_HOSTS=spoolman.example.com
      - TZ=Europe/Stockholm
      - SPOOLMAN_OIDC_ISSUER=http://fake-oidc:9000
      - SPOOLMAN_OIDC_CLIENT_ID=spoolman
      - SPOOLMAN_OIDC_CLIENT_SECRET=test-secret
      - SPOOLMAN_PUBLIC_URL=http://spoolman:8000
      - SPOOLMAN_SESSION_SECRET=xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
    depends_on:
      - fake-oidc
  tester:
    image: donkie/spoolman-tester:latest
    volumes:
      - ./tests:/tester/tests
    environment:
      - DB_TYPE=sqlite
    depends_on:
      - spoolman
